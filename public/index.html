<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <% const meta = htmlWebpackPlugin.options.pageMeta %>
    <meta name="description" content="<%- meta.description %>">

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="<%- meta.title %>">
    <% if (meta.url) { %><meta property="og:url" content="<%- meta.url %>"><% } %>
    <meta property="og:title" content="<%- meta.title %>">
    <meta property="og:description" content="<%- meta.description %>">
    <% if (meta.image) { %><meta property="og:image" content="<%- meta.image %>"><% } %>

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <% if (meta.url) { %><meta name="twitter:url" content="<%- meta.url %>"><% } %>
    <meta name="twitter:title" content="<%- meta.title %>">
    <meta name="twitter:description" content="<%- meta.description %>">
    <% if (meta.image) { %><meta name="twitter:image" content="<%- meta.image %>"><% } %>

    <link rel="icon" href="<%= BASE_URL %>img/cousin/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="<%= BASE_URL %>img/cousin/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="<%= BASE_URL %>img/cousin/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="<%= BASE_URL %>img/cousin/favicon-16x16.png">
    <link rel="manifest" href="<%= BASE_URL %>img/cousin/site.webmanifest">
    <meta name="msapplication-TileColor" content="#00a300">
    <meta name="theme-color" content="#ffffff">

    <title><%- meta.title %></title>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
